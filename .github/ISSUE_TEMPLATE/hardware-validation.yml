name: Hardware validation result
description: Contribute a sanitized physical-machine qualification result.
title: "hardware: "
labels: ["type:hardware", "evidence:needed"]
body:
  - type: input
    id: version
    attributes:
      label: Exact version, checksum, and architecture
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Sanitized platform
      description: Include CPU/GPU/network/storage families and BIOS/UEFI mode, not serial numbers.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Test coverage and outcomes
      description: List passes, failures, missing drivers, untested ports, and operator findings.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: No private report, key, credential, or stable identifier is attached.
          required: true
        - label: Tested drives were not mounted writable unless explicitly authorized.
          required: true
