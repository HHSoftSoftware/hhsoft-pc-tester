name: Publish verified downloads

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag at the current protected main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  RELEASES_ENABLED: ${{ vars.RELEASES_ENABLED }}
  RELEASE_SIGNING_KEY_FINGERPRINT: ${{ vars.RELEASE_SIGNING_KEY_FINGERPRINT }}

jobs:
  inspect:
    if: github.repository == 'HHSoftSoftware/hhsoft-pc-tester' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # RELEASES_ENABLED acknowledges reviewed branch/tag rules, environment
      # approvers, immutable releases, and exclusive release-writer access.
      # Workflow concurrency alone cannot exclude other API/UI writers.
      - name: Require configured protections and the approved signing key at main tip
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASES_ENABLED" = true
          commit=$(git rev-parse HEAD)
          python3 scripts/release/remote.py tag --tag "$RELEASE_TAG" --commit "$commit"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  validate:
    needs: inspect
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.inspect.outputs.commit }}

  prepare:
    needs: [inspect, validate]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_COMMIT: ${{ needs.inspect.outputs.commit }}
      LAB_SIGNING_KEY_FINGERPRINT: ${{ vars.LAB_SIGNING_KEY_FINGERPRINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: .go-version
      - name: Download only the complete draft candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/release/assets
          python3 scripts/release/remote.py snapshot --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --state build/release/state.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir build/release/assets
          python3 scripts/release/release.py check --candidate build/release/assets --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      # Canonical tar/member bytes are checked by release.py. Nested upstream
      # archives require the authenticated source-content-scan lab review.
      - name: Scan public image and source metadata with both engines
        run: |
          python3 scripts/release/release.py metadata --candidate build/release/assets --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --destination build/release-metadata
          python3 scripts/security/scan_source.py --root build/release-metadata
          sh scripts/security/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir build/release-metadata --no-banner --redact=100 --ignore-gitleaks-allow
      - name: Build and package companion utilities
        run: |
          for target in x86_64 x86 legacy-x86 aarch64 windows-x86_64; do
            sh scripts/build/build-go.sh "$target"
          done
          python3 scripts/release/release.py package --candidate build/release/assets --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - name: Recheck authorized source before minting attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/remote.py unchanged --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --state build/release/state.json
      - name: Attest utilities built by this workflow
        id: utilities
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/release/assets/hhpt-*.zip
      - name: Verify every utility and bind its bundle into the checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
          UTILITY_BUNDLE: ${{ steps.utilities.outputs.bundle-path }}
        run: |
          cp "$UTILITY_BUNDLE" build/release/assets/utilities.intoto.jsonl
          for archive in build/release/assets/hhpt-*.zip; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" --bundle build/release/assets/utilities.intoto.jsonl --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --signer-digest "$SOURCE_COMMIT" --source-digest "$SOURCE_COMMIT" --source-ref refs/heads/main --deny-self-hosted-runners
          done
          python3 scripts/release/release.py manifest --candidate build/release/assets --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - name: Sign checksum manifest with an explicit validation statement
        id: validation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/release/assets/SHA256SUMS
          predicate-type: https://github.com/HHSoftSoftware/hhsoft-pc-tester/release-validation/v1
          predicate-path: build/release-validation.json
      - name: Include checksum attestation for offline verification
        env:
          VALIDATION_BUNDLE: ${{ steps.validation.outputs.bundle-path }}
        run: |
          cp "$VALIDATION_BUNDLE" build/release/assets/checksums.intoto.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [inspect, prepare]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_COMMIT: ${{ needs.inspect.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: build/release
      - name: Verify signed manifest, unchanged draft, and uploaded bytes before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify build/release/assets/SHA256SUMS --repo "$GITHUB_REPOSITORY" --bundle build/release/assets/checksums.intoto.jsonl --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --signer-digest "$SOURCE_COMMIT" --source-digest "$SOURCE_COMMIT" --source-ref refs/heads/main --deny-self-hosted-runners --predicate-type https://github.com/HHSoftSoftware/hhsoft-pc-tester/release-validation/v1
          (cd build/release/assets && sha256sum --strict --check SHA256SUMS)
          for archive in build/release/assets/hhpt-*.zip; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" --bundle build/release/assets/utilities.intoto.jsonl --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --signer-digest "$SOURCE_COMMIT" --source-digest "$SOURCE_COMMIT" --source-ref refs/heads/main --deny-self-hosted-runners
          done
          python3 scripts/release/remote.py unchanged --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --state build/release/state.json
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" build/release/assets/hhpt-*.zip build/release/assets/LICENSE build/release/assets/VERSION build/release/assets/operator-guide.md build/release/assets/SHA256SUMS build/release/assets/*.intoto.jsonl
          python3 scripts/release/remote.py uploaded --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --state build/release/state.json --candidate build/release/assets
      - name: Publish the verified draft
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > build/release-notes.md <<'EOF'
          Bootable HHSoft PC Tester images and offline report utilities.

          Download the ISO for your hardware. AArch64 remains beta; legacy x86 is BIOS-only with reduced coverage. This release does not claim Secure Boot support.

          Verify SHA256SUMS using checksums.intoto.jsonl and the documented GitHub attestation command, then verify the downloaded files against that manifest. The checksum signature records validation of externally built lab images. The companion utility archives also carry GitHub build provenance in utilities.intoto.jsonl.

          See operator-guide.md, THIRD-PARTY-NOTICES.txt, SOURCE-OFFER.md, and SOURCE-MANIFEST.json. Download every numbered sources tar part for the included source, licenses, configurations, patches and build scripts. The signed source tag and release-evidence.json identify the reviewed source and image validation records.
          EOF
          prerelease=false
          case "$RELEASE_TAG" in *-*) prerelease=true ;; esac
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "HHSoft PC Tester $RELEASE_TAG" --notes-file build/release-notes.md --prerelease="$prerelease" --draft=false --latest=false
      # GitHub has no atomic compare-and-publish API. This detects a race or an
      # ambiguous edit response, but cannot retract an already public release.
      # No automatic deletion/recovery: retain the draft and investigate failures.
      - name: Check the published release, immutable state, tag, and every asset
        if: ${{ always() && steps.publication.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/remote.py published --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --state build/release/state.json --candidate build/release/assets
